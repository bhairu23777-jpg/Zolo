<h1>My Profile 👤</h1>
<p>Complete your NEET preparation profile.</p>

<form>

  <label>Profile Photo</label>
  <input type="file" id="photo" accept="image/*">

  <label>Full Name</label>
  <input type="text" id="fullName" placeholder="Enter your full name" required>

  <label>Mobile Number</label>
  <input type="tel" id="mobile" placeholder="Enter mobile number" required>

  <label>Father's Name</label>
  <input type="text" id="fatherName" placeholder="Father's name">

  <label>Mother's Name</label>
  <input type="text" id="motherName" placeholder="Mother's name">

  <label>Medium</label>
  <select id="medium" required>
    <option value="">Select medium</option>
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
  </select>

  <label>Target Year</label>
  <select id="targetYear" required>
    <option value="">Select target year</option>
    <option value="NEET 2027">NEET 2027</option>
    <option value="NEET 2028">NEET 2028</option>
  </select>

  <button type="submit">Save Profile</button>

</form>


  </div>

</main>

<script>
const savedUser = sessionStorage.getItem("zolo_user");

if (!savedUser) {
  window.location.href = "login.html";
}

const user = JSON.parse(savedUser);

document.getElementById("fullName").value = user.full_name || "";
document.getElementById("mobile").value = user.mobile || "";

document.querySelector("form").addEventListener("submit", async function(event) {
  event.preventDefault();

  const father_name = document.getElementById("fatherName").value.trim();
  const mother_name = document.getElementById("motherName").value.trim();
  const medium = document.getElementById("medium").value;
  const target_year = document.getElementById("targetYear").value;

  try {

    const response = await fetch(
      "https://zolo-st8s.onrender.com/api/profile",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          user_id: user.id,
          father_name,
          mother_name,
          medium,
          target_year
        })
      }
    );

    const data = await response.json();

    if (data.success) {
      alert("Profile saved successfully 🎉");
      window.location.href = "dashboard.html";
    } else {
      alert(data.message);
    }

  } catch (error) {
    console.error("Profile error:", error);
    alert("Server se connection nahi ho pa raha.");
  }
});
</script>

</body>
</html>
