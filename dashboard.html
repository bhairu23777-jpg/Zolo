  </section>

<script>
const savedUser = sessionStorage.getItem("zolo_user");

if (!savedUser) {
  window.location.href = "login.html";
} else {
  const user = JSON.parse(savedUser);

  document.getElementById("welcome").textContent =
    `Welcome, ${user.full_name} 👋`;
}

function logout() {
  sessionStorage.removeItem("zolo_user");
  window.location.href = "login.html";
}
</script>
