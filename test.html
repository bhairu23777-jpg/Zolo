<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zolo | Test Engine</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .test-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .test-page h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .muted {
      color: #667085;
      margin-bottom: 30px;
    }

    .test-card {
      background: white;
      border: 1px solid #e8ebf0;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 18px;
    }

    .test-card h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .option {
      border: 1px solid #d9dee8;
      background: white;
      color: #172033;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    .option.active {
      background: #172033;
      color: white;
    }

    .generate-btn {
      width: 100%;
      margin-top: 5px;
    }

    #testScreen,
    #resultScreen {
      display: none;
    }

    .test-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .timer {
      font-weight: 800;
      font-size: 20px;
    }

    .timer.warning {
      color: #dc2626;
    }

    .progress {
      color: #667085;
    }

    .question {
      font-size: 24px;
      line-height: 1.45;
      margin-bottom: 25px;
    }

    .answer {
      display: block;
      width: 100%;
      text-align: left;
      background: white;
      color: #172033;
      border: 1px solid #d9dee8;
      margin-bottom: 12px;
    }

    .answer:hover {
      border-color: #172033;
    }

    .answer.selected {
      background: #172033;
      color: white;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
    }

    .submit-test-btn {
      width: 100%;
      margin-top: 15px;
      background: #dc2626;
      color: white;
    }

    .result-box {
      text-align: center;
      padding: 40px 20px;
    }

    .score {
      font-size: 58px;
      font-weight: 800;
      margin: 20px 0;
    }

    .result-info {
      color: #667085;
      line-height: 1.8;
      font-size: 18px;
    }

    .save-status {
      margin-top: 20px;
      font-size: 14px;
      color: #667085;
    }

    .back-dashboard {
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .test-page {
        margin: 20px auto;
        padding: 15px;
      }

      .test-page h1 {
        font-size: 34px;
      }

      .question {
        font-size: 20px;
      }

      .navigation {
        flex-direction: column;
      }

      .score {
        font-size: 46px;
      }
    }
  </style>

</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">zolo</a>

  <nav>
    <a href="index.html">Home</a>

  </nav>

<script>

/* ==========================================
   CONFIG
========================================== */

const API_URL =
  "https://zolo-st8s.onrender.com";


/* ==========================================
   QUESTION BANK
========================================== */

const questionBank = [

  {
    q: "The SI unit of force is:",
    options: [
      "Joule",
      "Newton",
      "Watt",
      "Pascal"
    ],
    answer: 1
  },

  {
    q: "Which quantity is a vector?",
    options: [
      "Speed",
      "Distance",
      "Velocity",
      "Mass"
    ],
    answer: 2
  },

  {
    q: "Acceleration due to gravity near Earth's surface is approximately:",
    options: [
      "4.8 m/s²",
      "9.8 m/s²",
      "19.6 m/s²",
      "98 m/s²"
    ],
    answer: 1
  },

  {
    q: "The SI unit of work is:",
    options: [
      "Newton",
      "Watt",
      "Joule",
      "Pascal"
    ],
    answer: 2
  },

  {
    q: "Which law explains action and reaction?",
    options: [
      "Newton's First Law",
      "Newton's Second Law",
      "Newton's Third Law",
      "Ohm's Law"
    ],
    answer: 2
  },

  {
    q: "The speed of light in vacuum is approximately:",
    options: [
      "3 × 10⁶ m/s",
      "3 × 10⁸ m/s",
      "3 × 10¹⁰ m/s",
      "3 × 10⁵ m/s"
    ],
    answer: 1
  },

  {
    q: "Which particle has a negative charge?",
    options: [
      "Proton",
      "Neutron",
      "Electron",
      "Photon"
    ],
    answer: 2
  },

  {
    q: "Ohm's law is represented by:",
    options: [
      "V = IR",
      "P = VI",
      "F = ma",
      "Q = It"
    ],
    answer: 0
  },

  {
    q: "The unit of electric current is:",
    options: [
      "Volt",
      "Ampere",
      "Ohm",
      "Coulomb"
    ],
    answer: 1
  },

  {
    q: "Which one is a scalar quantity?",
    options: [
      "Velocity",
      "Acceleration",
      "Force",
      "Temperature"
    ],
    answer: 3
  }

];


/* ==========================================
   STATE
========================================== */

let questions = [];

let currentQuestion = 0;

let selectedAnswers = [];

let timeLeft = 900;

let timerInterval = null;

let testSubmitted = false;

let selectedSubject = "Physics";

let selectedChapter = "Full Syllabus";

let selectedCount = 10;


/* ==========================================
   DOM
========================================== */

const generatorScreen =
  document.getElementById("generatorScreen");

const testScreen =
  document.getElementById("testScreen");

const resultScreen =
  document.getElementById("resultScreen");


/* ==========================================
   OPTION SELECTION
========================================== */

document
  .querySelectorAll(".options")
  .forEach(group => {

    group
      .querySelectorAll(".option")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            group
              .querySelectorAll(".option")
              .forEach(item => {
                item.classList.remove("active");
              });

            button.classList.add("active");

          }
        );

      });

  });


/* ==========================================
   GENERATE TEST
========================================== */

function generateTest() {

  const subjectButton =
    document.querySelector(
      '[data-group="subject"] .active'
    );

  const chapterButton =
    document.querySelector(
      '[data-group="chapter"] .active'
    );

  const countButton =
    document.querySelector(
      '[data-group="count"] .active'
    );


  selectedSubject =
    subjectButton?.dataset.value ||
    subjectButton?.textContent.trim() ||
    "Physics";


  selectedChapter =
    chapterButton?.dataset.value ||
    chapterButton?.textContent.trim() ||
    "Full Syllabus";


  selectedCount =
    Number(countButton?.dataset.count || 10);


  questions = [];


  /*
    Temporary question bank behavior:
    Until the real database question bank is connected,
    questions repeat when count > available questions.
  */

  for (
    let i = 0;
    i < selectedCount;
    i++
  ) {

    questions.push(
      questionBank[
        i % questionBank.length
      ]
    );

  }


  selectedAnswers =
    new Array(questions.length).fill(null);


  currentQuestion = 0;

  testSubmitted = false;


  /*
    90 seconds per question.
    Minimum 60 seconds.
  */

  timeLeft =
    Math.max(
      60,
      questions.length * 90
    );


  generatorScreen.style.display =
    "none";

  resultScreen.style.display =
    "none";

  testScreen.style.display =
    "block";


  startTimer();

  renderQuestion();

}


/* ==========================================
   RENDER QUESTION
========================================== */

function renderQuestion() {

  if (!questions.length) {
    return;
  }


  const question =
    questions[currentQuestion];


  document.getElementById(
    "progress"
  ).textContent =
    `Question ${currentQuestion + 1} of ${questions.length}`;


  document.getElementById(
    "questionText"
  ).textContent =
    question.q;


  const answers =
    document.getElementById("answers");


  answers.innerHTML = "";


  question.options.forEach(
    (option, index) => {

      const button =
        document.createElement("button");


      button.type = "button";

      button.className =
        "answer";


      button.textContent =
        `${String.fromCharCode(65 + index)}. ${option}`;


      if (
        selectedAnswers[currentQuestion] ===
        index
      ) {

        button.classList.add(
          "selected"
        );

      }


      button.onclick = () => {

        selectedAnswers[
          currentQuestion
        ] = index;


        document
          .querySelectorAll(".answer")
          .forEach(item => {

            item.classList.remove(
              "selected"
            );

          });


        button.classList.add(
          "selected"
        );

      };


      answers.appendChild(button);

    }
  );


  const prevBtn =
    document.getElementById("prevBtn");

  const nextBtn =
    document.getElementById("nextBtn");


  prevBtn.disabled =
    currentQuestion === 0;


  const lastQuestion =
    currentQuestion ===
    questions.length - 1;


  /*
    Next button disappears on last question.
  */

  nextBtn.style.display =
    lastQuestion
      ? "none"
      : "block";


  /*
    Submit button ALWAYS remains available.
    This fixes the situation where user cannot
    find Submit.
  */

  document.getElementById(
    "submitBtn"
  ).style.display =
    "block";

}


/* ==========================================
   NEXT
========================================== */

function nextQuestion() {

  if (
    currentQuestion <
    questions.length - 1
  ) {

    currentQuestion++;

    renderQuestion();

  }

}


/* ==========================================
   PREVIOUS
========================================== */

function previousQuestion() {

  if (
    currentQuestion > 0
  ) {

    currentQuestion--;

    renderQuestion();

  }

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

  clearInterval(
    timerInterval
  );


  updateTimer();


  timerInterval =
    setInterval(() => {

      if (testSubmitted) {

        clearInterval(
          timerInterval
        );

        return;

      }


      timeLeft--;

      updateTimer();


      if (timeLeft <= 0) {

        clearInterval(
          timerInterval
        );

        submitTest(true);

      }

    }, 1000);

}


/* ==========================================
   UPDATE TIMER
========================================== */

function updateTimer() {

  const timer =
    document.getElementById("timer");


  const minutes =
    Math.floor(
      timeLeft / 60
    );


  const seconds =
    timeLeft % 60;


  timer.textContent =
    `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


  if (timeLeft <= 60) {

    timer.classList.add(
      "warning"
    );

  } else {

    timer.classList.remove(
      "warning"
    );

  }

}


/* ==========================================
   SUBMIT TEST
========================================== */

async function submitTest(autoSubmitted = false) {

  /*
    Prevent double submission.
  */

  if (testSubmitted) {
    return;
  }


  testSubmitted = true;


  clearInterval(
    timerInterval
  );


  let correct = 0;

  let incorrect = 0;

  let unanswered = 0;


  questions.forEach(
    (question, index) => {

      const selected =
        selectedAnswers[index];


      if (
        selected === null ||
        selected === undefined
      ) {

        unanswered++;

      }

      else if (
        selected === question.answer
      ) {

        correct++;

      }

      else {

        incorrect++;

      }

    }
  );


  const attempted =
    correct + incorrect;


  /*
    NEET-style marking:
    Correct = +4
    Wrong = -1
    Unanswered = 0
  */

  const score =
    (correct * 4) -
    incorrect;


  /*
    SHOW RESULT IMMEDIATELY.
    API should NEVER block the result screen.
  */

  testScreen.style.display =
    "none";

  generatorScreen.style.display =
    "none";

  resultScreen.style.display =
    "block";


  document.getElementById(
    "score"
  ).textContent =
    `${score} / ${questions.length * 4}`;


  document.getElementById(
    "correct"
  ).textContent =
    correct;


  document.getElementById(
    "incorrect"
  ).textContent =
    incorrect;


  document.getElementById(
    "unanswered"
  ).textContent =
    unanswered;


  document.getElementById(
    "attempted"
  ).textContent =
    attempted;


  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  if (autoSubmitted) {

    saveStatus.textContent =
      "⏰ Time finished. Result calculated.";

  } else {

    saveStatus.textContent =
      "Saving result...";

  }


  /*
    Get logged-in user.
  */

  const savedUser =
    sessionStorage.getItem(
      "zolo_user"
    );


  /*
    If user is not logged in,
    result still remains visible.
  */

  if (!savedUser) {

    saveStatus.textContent =
      "Result calculated. Login to save your result.";

    return;

  }


  let user;


  try {

    user =
      JSON.parse(savedUser);

  } catch (error) {

    console.error(
      "User data error:",
      error
    );


    saveStatus.textContent =
      "Result calculated, but account data could not be read.";

    return;

  }


  if (!user.id) {

    saveStatus.textContent =
      "Result calculated. User ID missing, so result was not saved.";

    return;

  }


  /*
    SAVE RESULT TO BACKEND
  */

  try {

    const response =
      await fetch(
        `${API_URL}/api/results`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            user_id:
              user.id,

            subject:
              selectedSubject,

            total_questions:
              questions.length,

            attempted:
              attempted,

            correct:
              correct,

            wrong:
              incorrect,

            score:
              score

          })

        }
      );


    const data =
      await response.json();


    if (
      response.ok &&
      data.success
    ) {

      saveStatus.textContent =
        "✅ Result saved successfully.";

    } else {

      saveStatus.textContent =
        "Result calculated, but server could not save it.";

      console.error(
        "Result API error:",
        data
      );

    }

  } catch (error) {

    /*
      IMPORTANT:
      API failure must NOT hide result.
    */

    console.error(
      "Result save error:",
      error
    );


    saveStatus.textContent =
      "Result calculated. Server connection failed, so it was not saved.";

  }

}


/* ==========================================
   PAGE SAFETY
========================================== */

window.addEventListener(
  "beforeunload",
  event => {

    if (
      testScreen.style.display ===
      "block" &&
      !testSubmitted
    ) {

      event.preventDefault();

      event.returnValue = "";

    }

  }
);

</script>
