```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zolo | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">zolo</a>
</header>

<main class="auth-page">

  <div class="auth-card">

    <h1>Welcome back</h1>
    <p>Login to continue your NEET preparation.</p>

    <form onsubmit="login(event)">

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>

    </form>

    <p class="auth-bottom">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </p>

  </div>

</main>

<script>
async function login(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const response = await fetch(
      "https://zolo-st8s.onrender.com/api/login",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await response.json();

    if (data.success) {

      // Save basic logged-in user information
      sessionStorage.setItem(
        "zolo_user",
        JSON.stringify(data.user)
      );

      alert("Login successful 🎉");

      window.location.href = "dashboard.html";

    } else {
      alert(data.message);
    }

  } catch (error) {
    console.error("Login error:", error);

    alert("Server se connection nahi ho pa raha.");
  }
}
</script>

</body>
</html>
```
